name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: composer lint

  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Start wp-env
        run: npx --yes @wordpress/env start

      - name: Determine test database host
        id: dbhost
        run: |
          # wp-env publishes the tests MySQL container on a dynamic host port.
          # Read it straight from Docker so we don't have to parse wp-env's output.
          container="$(docker ps --format '{{.Names}}' | grep -E 'tests-mysql' | head -1)"
          if [ -z "$container" ]; then
            echo "::error::Could not find the wp-env tests MySQL container."
            docker ps
            exit 1
          fi
          port="$(docker port "$container" 3306/tcp | head -1 | sed 's/.*://')"
          echo "host=127.0.0.1:${port}" >> "$GITHUB_OUTPUT"
          echo "Tests DB reachable at 127.0.0.1:${port}"

      - name: Run PHPUnit
        env:
          WP_ENV_TEST_DB_HOST: ${{ steps.dbhost.outputs.host }}
        run: composer test

      - name: Stop wp-env
        if: always()
        run: npx --yes @wordpress/env stop
