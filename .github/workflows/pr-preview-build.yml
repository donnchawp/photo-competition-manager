name: PR Preview - Build

# Builds the plugin the way `make release` does (JS/CSS bundles included,
# since they aren't committed) and hands the zip to "PR Preview - Publish".
# Runs with read-only permissions, so it's safe for pull requests from forks.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  build:
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@v4
    with:
      artifacts: photo-competition-manager=build/photo-competition-manager.zip
      node-version: '20'
      build-command: |
        set -euo pipefail
        npm --prefix assets ci
        npm --prefix assets run build
        rm -rf stage build
        mkdir -p stage/photo-competition-manager build
        rsync -a --exclude-from=.releaseignore src/ stage/photo-competition-manager/
        test -f stage/photo-competition-manager/assets/build/drag-drop-upload.js
        ( cd stage && zip -qr ../build/photo-competition-manager.zip photo-competition-manager )
