name: PR Preview - Publish

# Publishes the zip from "PR Preview - Build" to the ci-artifacts prerelease
# and adds a "Preview in WordPress Playground" button to the pull request.
# The button boots WordPress with that zip installed, adds three members (one
# per default grade), Upload, Voting and Results pages, and a competition open
# from today for a week, logs in as
# admin and opens the plugin's Competitions screen.
# GitHub runs workflow_run workflows from the default branch, so changes to
# this file only take effect once they're on main.
on:
  workflow_run:
    workflows: ['PR Preview - Build']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@v4
    with:
      blueprint: |
        {
          "$schema": "https://playground.wordpress.net/blueprint-schema.json",
          "landingPage": "/wp-admin/admin.php?page=photo-competition-manager",
          "preferredVersions": {
            "php": "8.3",
            "wp": "latest"
          },
          "steps": [
            {
              "step": "login",
              "username": "admin"
            },
            {
              "step": "installPlugin",
              "pluginData": {
                "resource": "url",
                "url": "{{ARTIFACT_URL:photo-competition-manager}}"
              },
              "options": {
                "activate": true
              }
            },
            {
              "step": "runPHP",
              "code": "<?php\nrequire_once '/wordpress/wp-load.php';\n\nuse PhotoCompetitionManager\\Repository\\Competitions_Repository;\nuse PhotoCompetitionManager\\Repository\\Members_Repository;\nuse PhotoCompetitionManager\\Support\\Competition_Settings;\n\nforeach ( array(\n\t'Upload'  => '[competition_upload]',\n\t'Voting'  => '[competition_voting]',\n\t'Results' => '[competition_results]',\n) as $page_title => $shortcode ) {\n\twp_insert_post( array( 'post_type' => 'page', 'post_status' => 'publish', 'post_title' => $page_title, 'post_content' => $shortcode ) );\n}\n\n$members = new Members_Repository();\nforeach ( array(\n\tarray( 'Ann Beginner', 'ann@example.com', 'beginner' ),\n\tarray( 'Bob Intermediate', 'bob@example.com', 'intermediate' ),\n\tarray( 'Cat Advanced', 'cat@example.com', 'advanced' ),\n) as $m ) {\n\t$members->create( array( 'name' => $m[0], 'email' => $m[1], 'grade' => $m[2] ) );\n}\n\n$data = array(\n\t'title'      => 'Test competition',\n\t'slug'       => 'test-competition',\n\t'open_date'  => wp_date( 'Y-m-d' ),\n\t'close_date' => wp_date( 'Y-m-d', time() + 7 * DAY_IN_SECONDS ),\n\t'share_hash' => Competition_Settings::generate_share_hash(),\n);\n\n$types_class = 'PhotoCompetitionManager\\Repository\\Competition_Types_Repository';\nif ( class_exists( $types_class ) ) {\n\t$types            = new $types_class();\n\t$type             = $types->only() ?? $types->all()[0];\n\t$data['type_id']  = (int) $type->id;\n\t$data['settings'] = Competition_Settings::settings_for_new_competition( $type );\n} else {\n\t$data['settings'] = array_merge(\n\t\tarray_diff_key( Competition_Settings::global_settings(), array( 'grades' => true ) ),\n\t\tarray( 'categories' => Competition_Settings::club_categories() )\n\t);\n}\n\n$result = ( new Competitions_Repository() )->create( $data );\nif ( is_wp_error( $result ) ) {\n\terror_log( 'Playground seed: ' . $result->get_error_message() );\n}\n"
            }
          ]
        }
